<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>KUMBI - Sistema de Transporte</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/frontend/css/auth.css">
</head>

<body>
    <!-- Box da Imagem - lado esquerdo -->
    <div class="image-box">
       
    </div>

    <!-- Box do Login/Cadastro - lado direito -->
    <div class="auth-box">
        <div class="auth-container">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-bus"></i>
                    <h1>KUMBI</h1>
                </div>
                <p>Faça login ou crie sua conta</p>
            </div>

            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Entrar</button>
                <button class="tab-btn" data-tab="register">Cadastrar</button>
            </div>

            <!-- Formulário de Login -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword"><i class="fas fa-lock"></i> Senha</label>
                    <input type="password" id="loginPassword" placeholder="Sua senha" required>
                </div>

                <div class="form-group">
                    <label for="userType"><i class="fas fa-user-tag"></i> Tipo de Usuário</label>
                    <select id="userType" required>
                        <option value="">Selecione...</option>
                        <option value="passageiro">Passageiro</option>
                        <option value="motorista">Motorista</option>
                        <option value="empresa">Empresa</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regName"><i class="fas fa-user"></i> Nome Completo</label>
                    <input type="text" id="regName" placeholder="Seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="regEmail"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="regEmail" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="regPhone"><i class="fas fa-phone"></i> Telefone</label>
                    <input type="tel" id="regPhone" placeholder="+244 XXX XXX XXX" required>
                </div>

                <div class="form-group">
                    <label for="regPassword"><i class="fas fa-lock"></i> Senha</label>
                    <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="regUserType"><i class="fas fa-user-tag"></i> Sou um:</label>
                    <select id="regUserType" required onchange="toggleRegistrationFields()">
                        <option value="">Selecione...</option>
                        <option value="passageiro">Passageiro</option>
                        <option value="motorista">Motorista</option>
                        <option value="empresa">Empresa</option>
                    </select>
                </div>

                <!-- Campos específicos para Motorista -->
                <div id="motoristaFields" class="extra-fields" style="display: none;">
                    <div class="form-group">
                        <label for="regCartaConducao"><i class="fas fa-id-card"></i> Carta de Condução</label>
                        <input type="text" id="regCartaConducao" placeholder="Número da carta">
                    </div>
                    <div class="form-group">
                        <label for="regEmpresa"><i class="fas fa-building"></i> Empresa Vinculada</label>
                        <input type="text" id="regEmpresa" placeholder="Nome da empresa">
                    </div>
                </div>

                <!-- Campos específicos para Empresa -->
                <div id="empresaFields" class="extra-fields" style="display: none;">
                    <div class="form-group">
                        <label for="regNIF"><i class="fas fa-file-invoice"></i> NIF da Empresa</label>
                        <input type="text" id="regNIF" placeholder="Número de Identificação Fiscal">
                    </div>
                    <div class="form-group">
                        <label for="regEndereco"><i class="fas fa-map-marker-alt"></i> Endereço</label>
                        <input type="text" id="regEndereco" placeholder="Endereço da empresa">
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-user-plus"></i> Criar Conta
                </button>
            </form>

            <div class="auth-footer">
                <p>Ao cadastrar-se, você concorda com nossos <a href="./index5.html">Termos de Uso</a> e <a
                        href="#">Política de Privacidade</a>.</p>
                <p class="map-note">Atualmente disponível em Luanda e Icolo e Bengo</p>
            </div>
        </div>
    </div>

    <script>
        // Função para alternar entre as abas de login e cadastro
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                // Remove active de todos os botões e forms
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

                // Adiciona active no botão clicado
                this.classList.add('active');

                // Mostra o form correspondente
                const tab = this.dataset.tab;
                if (tab === 'login') {
                    document.getElementById('loginForm').classList.add('active');
                } else {
                    document.getElementById('registerForm').classList.add('active');
                }
            });
        });

        // Função para mostrar/esconder campos específicos no cadastro
        window.toggleRegistrationFields = function () {
            const userType = document.getElementById('regUserType').value;
            const motoristaFields = document.getElementById('motoristaFields');
            const empresaFields = document.getElementById('empresaFields');

            motoristaFields.style.display = 'none';
            empresaFields.style.display = 'none';

            if (userType === 'motorista') {
                motoristaFields.style.display = 'block';
            } else if (userType === 'empresa') {
                empresaFields.style.display = 'block';
            }
        };

        // Prevenir envio dos formulários para demonstração
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Funcionalidade de login em desenvolvimento!');
        });

        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Funcionalidade de cadastro em desenvolvimento!');
        });

        // Ajuste dinâmico para diferentes orientações
        function handleOrientationChange() {
            if (window.innerHeight < 500 && window.innerWidth > window.innerHeight) {
                document.body.style.flexDirection = 'row';
            } else if (window.innerWidth <= 768) {
                document.body.style.flexDirection = 'column';
            }
        }

        window.addEventListener('resize', handleOrientationChange);
        window.addEventListener('orientationchange', handleOrientationChange);
    </script>
</body>

</html>
